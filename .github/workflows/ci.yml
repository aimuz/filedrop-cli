name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - run: go vet ./...
      - run: gofmt -l . | tee /tmp/gofmt.out && test ! -s /tmp/gofmt.out
      # go fix 发现的所有现代化改写应当已经合入；有输出说明有代码没跟上。
      - run: go fix -diff ./...
      - run: go test ./... -race -count=1
      - run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o filedrop ./cmd/filedrop

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          name="filedrop_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "filedrop" ./cmd/filedrop
          if [ "${{ matrix.goos }}" = "windows" ]; then
            mv filedrop.exe "${name}.exe"
          else
            mv filedrop "${name}"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: filedrop_*
